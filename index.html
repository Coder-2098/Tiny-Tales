
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyTales Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&family=Bubblegum+Sans&family=Schoolbell&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Lexend', sans-serif;
        overflow-x: hidden;
        background-color: #0d2b36; /* Deep jungle teal from image */
      }
      .font-kids {
        font-family: 'Bubblegum Sans', cursive;
      }
      .font-storybook {
        font-family: 'Schoolbell', cursive;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        border: 2px solid rgba(255, 255, 255, 0.5);
      }
      
      /* Jungle Theme Background Elements */
      .jungle-bg {
        background: radial-gradient(circle at 50% 30%, #1a4d5e 0%, #0d2b36 70%);
        position: fixed;
        inset: 0;
        z-index: -1;
      }
      
      .moon {
        position: absolute;
        top: 10%;
        left: 50%;
        transform: translateX(-50%);
        width: 300px;
        height: 300px;
        background: radial-gradient(circle at 30% 30%, #fffce0, #e8dfac);
        border-radius: 50%;
        box-shadow: 0 0 80px rgba(232, 223, 172, 0.4);
        opacity: 0.8;
      }

      .tree-silhouette {
        position: absolute;
        bottom: 0;
        fill: #06181f;
        pointer-events: none;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(5deg); }
      }
      @keyframes float-slow {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        33% { transform: translateY(-15px) translateX(10px); }
        66% { transform: translateY(10px) translateX(-5px); }
      }
      
      .floating-slow {
        animation: float-slow 12s ease-in-out infinite;
      }

      .jungle-text-shadow {
        text-shadow: 2px 2px 0px rgba(0,0,0,0.3);
      }
      
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
  }
}
</script>
</head>
<body class="min-h-screen">
    <div id="root"></div>
</body>
</html>
